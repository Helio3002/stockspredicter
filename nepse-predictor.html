  .ai-btn { margin-top: 14px; padding: 9px 18px; background: var(--green-dim); border: 1px solid rgba(74,200,120,0.25); border-radius: var(--radius); color: var(--green); font-size: 13px; cursor: pointer; font-family: var(--sans); width: 100%; transition: all 0.15s; }

<script>
// ═══════════════════════════════════════
// DATA LAYER — Live API + fallback simulation
// Backend: http://localhost:3001 (run server.js)
// ═══════════════════════════════════════

const API_BASE = 'http://localhost:3001/api';
let backendOnline = false;

// Fallback static data (used when backend is offline)
const STOCKS_FALLBACK = {
  NABIL:  { name: 'Nabil Bank', sector: 'Banking', ltp: 1284, prevClose: 1261, high52: 1540, low52: 980, volume: 42300, marketCap: '38.4B', pe: 18.2 },
  NICA:   { name: 'NIC Asia Bank', sector: 'Banking', ltp: 740, prevClose: 747, high52: 920, low52: 580, volume: 31200, marketCap: '21.1B', pe: 14.6 },
  CHCL:   { name: 'Chilime Hydropower', sector: 'Hydro', ltp: 502, prevClose: 492, high52: 680, low52: 390, volume: 18900, marketCap: '8.2B', pe: 22.1 },
  NPCL:   { name: 'Nepal Power Co.', sector: 'Hydro', ltp: 388, prevClose: 391, high52: 510, low52: 290, volume: 14200, marketCap: '4.9B', pe: 19.4 },
  UPPER:  { name: 'Upper Tamakoshi', sector: 'Hydro', ltp: 310, prevClose: 308, high52: 420, low52: 240, volume: 22100, marketCap: '6.7B', pe: 17.8 },
  SHIVM:  { name: 'Shivam Cement', sector: 'Manufacturing', ltp: 213, prevClose: 220, high52: 310, low52: 180, volume: 9800, marketCap: '2.1B', pe: 12.3 },
  NRIC:   { name: 'Nepal Reinsurance', sector: 'Insurance', ltp: 920, prevClose: 905, high52: 1100, low52: 720, volume: 5400, marketCap: '5.8B', pe: 24.5 },
  LICN:   { name: 'Life Insurance Corp Nepal', sector: 'Insurance', ltp: 1820, prevClose: 1800, high52: 2100, low52: 1500, volume: 3200, marketCap: '14.2B', pe: 31.0 },
  GBIME:  { name: 'Global IME Bank', sector: 'Banking', ltp: 298, prevClose: 295, high52: 380, low52: 220, volume: 58000, marketCap: '16.2B', pe: 11.8 },
  SCB:    { name: 'Standard Chartered Bank', sector: 'Banking', ltp: 2100, prevClose: 2080, high52: 2500, low52: 1800, volume: 4100, marketCap: '24.6B', pe: 28.4 },
};

// Live stock cache
const STOCKS = { ...STOCKS_FALLBACK };

// Check if backend is online
async function checkBackend() {
  try {
    const r = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(3000) });
    backendOnline = r.ok;
  } catch { backendOnline = false; }
  updateStatusBadge();
  return backendOnline;
}

function updateStatusBadge() {
  const badge = document.getElementById('statusBadge');
  if (!badge) return;
  if (backendOnline) {
    badge.innerHTML = '<span class="live-dot"></span>Live data';
    badge.style.color = 'var(--green)';
  } else {
    badge.innerHTML = '⚠ Demo mode — start server.js for live data';
    badge.style.color = 'var(--amber)';
    badge.style.borderColor = 'rgba(240,169,64,0.3)';
  }
}

// Fetch a single stock from backend
async function fetchLiveStock(symbol) {
  if (!backendOnline) return null;
  try {
    const r = await fetch(`${API_BASE}/stock/${symbol}`);
    if (!r.ok) return null;
    const d = await r.json();
    // Normalise field names to match our internal format
    return {
      name: STOCKS_FALLBACK[symbol]?.name || symbol,
      sector: STOCKS_FALLBACK[symbol]?.sector || 'NEPSE',
      ltp: d.ltp, prevClose: d.prevClose, high: d.high, low: d.low,
      high52: d.high52, low52: d.low52, volume: d.volume,
      marketCap: d.marketCap || '—', pe: d.pe, eps: d.eps,
      bookValue: d.bookValue, change: d.change, pctChange: d.pctChange,
      sources: d.sources || [], fetchedAt: d.fetchedAt
    };
  } catch { return null; }
}

// Fetch historical prices from backend
async function fetchLiveHistory(symbol, days = 90) {
  if (!backendOnline) return null;
  try {
    const r = await fetch(`${API_BASE}/stock/${symbol}/history?days=${days}`);
    if (!r.ok) return null;
    const d = await r.json();
    return (d.prices || []).map(p => p.close).filter(Boolean).reverse();
  } catch { return null; }
}

// Fetch market summary
async function fetchMarketSummary() {
  if (!backendOnline) return null;
  try {
    const r = await fetch(`${API_BASE}/market`);
    return r.ok ? r.json() : null;
  } catch { return null; }
}

const WATCHLIST = ['NABIL','NICA','CHCL','UPPER','GBIME'];
let currentStock = 'NABIL';
let priceChart = null;
let portfolioHoldings = [
  { sym: 'NABIL', qty: 50, avgCost: 1180 },
  { sym: 'CHCL',  qty: 100, avgCost: 460 },
  { sym: 'NICA',  qty: 80, avgCost: 780 },
];

// Generate realistic price history
function genPrices(base, days, volatility = 0.018) {
  let p = base * (1 - (Math.random()*0.12+0.06));
  return Array.from({ length: days }, (_, i) => {
    const trend = 0.0008;
    p = p * (1 + (Math.random()-0.48)*volatility + trend);
    return parseFloat(p.toFixed(1));
  });
}

// Technical indicators
function calcRSI(prices, period = 14) {
  if (prices.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = prices.length - period; i < prices.length; i++) {
    const d = prices[i] - prices[i-1];
    if (d > 0) gains += d; else losses -= d;
  }
  const rs = gains / (losses || 0.001);
  return parseFloat((100 - 100/(1+rs)).toFixed(1));
}

function calcSMA(prices, period) {
  const slice = prices.slice(-period);
  return parseFloat((slice.reduce((a,b) => a+b, 0) / slice.length).toFixed(1));
}

function calcMACD(prices) {
  const ema12 = calcEMA(prices, 12);
  const ema26 = calcEMA(prices, 26);
  const macd = ema12 - ema26;
  return parseFloat(macd.toFixed(2));
}

function calcEMA(prices, period) {
  const k = 2 / (period + 1);
  let ema = prices.slice(0, period).reduce((a,b)=>a+b,0)/period;
  for (let i = period; i < prices.length; i++) ema = prices[i]*k + ema*(1-k);
  return ema;
}

function calcBollinger(prices, period = 20) {
  const sma = calcSMA(prices, period);
  const slice = prices.slice(-period);
  const variance = slice.reduce((a,b) => a + Math.pow(b-sma,2), 0) / period;
  const std = Math.sqrt(variance);
  return { upper: parseFloat((sma+2*std).toFixed(1)), lower: parseFloat((sma-2*std).toFixed(1)), mid: parseFloat(sma.toFixed(1)) };
}

function getSignal(stock, prices) {
  const rsi = calcRSI(prices);
  const sma20 = calcSMA(prices, 20);
  const sma50 = calcSMA(prices, 50);
  const macd = calcMACD(prices);
  const boll = calcBollinger(prices);
  const ltp = stock.ltp;
  let score = 0;
  if (rsi < 35) score += 2; else if (rsi < 50) score += 1; else if (rsi > 70) score -= 2; else if (rsi > 60) score -= 1;
  if (macd > 0) score += 1; else score -= 1;
  if (ltp > sma20 && sma20 > sma50) score += 2;
  else if (ltp < sma20 && sma20 < sma50) score -= 2;
  else if (ltp > sma20) score += 1;
  else score -= 1;
  if (ltp < boll.lower) score += 1;
  else if (ltp > boll.upper) score -= 1;
  if (score >= 3) return 'STRONG BUY';
  if (score >= 1) return 'BUY';
  if (score <= -3) return 'STRONG SELL';
  if (score <= -1) return 'SELL';
  return 'HOLD';
}

function signalClass(sig) {
  if (sig.includes('BUY')) return 'buy';
  if (sig.includes('SELL')) return 'sell';
  return 'hold';
}
function sigPillClass(sig) {
  if (sig.includes('BUY')) return 'sig-buy';
  if (sig.includes('SELL')) return 'sig-sell';
  return 'sig-hold';
}
function sigColor(sig) {
  if (sig.includes('BUY')) return 'var(--green)';
  if (sig.includes('SELL')) return 'var(--red)';
  return 'var(--amber)';
}

// ═══════════════════════════════════════
// AI ANALYSIS via Claude API
// ═══════════════════════════════════════
async function getAIAnalysis(symbol, stock, indicators) {
  const el = document.getElementById('aiContent');
  const zonesEl = document.getElementById('aiZones');
  if (!el) return;
  el.innerHTML = '<div class="ai-loading"><div class="spinner"></div> Analysing with Claude AI...</div>';
  if (zonesEl) zonesEl.innerHTML = '';

  const prompt = `You are a NEPSE (Nepal Stock Exchange) stock analyst. Analyse the following stock and give a concise, actionable trading recommendation.

Stock: ${symbol} — ${stock.name} (${stock.sector} sector)
Current Price: Rs ${stock.ltp}
Previous Close: Rs ${stock.prevClose}
52-week High: Rs ${stock.high52} | Low: Rs ${stock.low52}
Volume: ${stock.volume.toLocaleString()} shares
P/E Ratio: ${stock.pe}
RSI (14): ${indicators.rsi}
MACD: ${indicators.macd > 0 ? '+' : ''}${indicators.macd} (${indicators.macd > 0 ? 'Bullish' : 'Bearish'})
SMA 20: Rs ${indicators.sma20} | SMA 50: Rs ${indicators.sma50}
Bollinger Upper: Rs ${indicators.boll.upper} | Lower: Rs ${indicators.boll.lower}
Overall Signal: ${indicators.signal}

Respond ONLY with a JSON object, no markdown, no backticks:
{
  "summary": "2-3 sentence analysis",
  "entry": "Rs X–Y",
  "target": "Rs X",
  "stopLoss": "Rs X",
  "risk": "Low|Medium|High",
  "timeframe": "Short-term|Medium-term|Long-term"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const raw = data.content?.map(c => c.text || '').join('') || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    el.textContent = parsed.summary;
    if (zonesEl) {
      zonesEl.innerHTML = `
        <div class="ai-zone">
          <div class="az-label">Entry zone</div>
          <div class="az-val up">${parsed.entry}</div>
        </div>
        <div class="ai-zone">
          <div class="az-label">Target</div>
          <div class="az-val up">${parsed.target}</div>
        </div>
        <div class="ai-zone">
          <div class="az-label">Stop loss</div>
          <div class="az-val dn">${parsed.stopLoss}</div>
        </div>`;
    }
    document.getElementById('aiRisk').textContent = `Risk: ${parsed.risk} · ${parsed.timeframe}`;
  } catch(e) {
    el.textContent = 'AI analysis unavailable at the moment. The technical indicators above still provide a reliable signal.';
  }
}

// RENDER
// ═══════════════════════════════════════

function renderSidebar() {
  const wi = document.getElementById('watchlistItems');
  const qp = document.getElementById('quickPicks');
  wi.innerHTML = WATCHLIST.map(sym => {
    const s = STOCKS[sym];
    if (!s) return '';
    const prices = genPrices(s.ltp, 60);
    const sig = getSignal(s, prices);
    const chg = ((s.ltp - s.prev)/s.prev*100).toFixed(2);
    return `<div class="stock-item ${sym === currentStock ? 'active' : ''}" onclick="loadStock('${sym}')" id="wi-${sym}">
      <span class="stock-sym">${sym}</span>
      <span class="stock-name-small">${s.name}</span>
      <span class="stock-sig ${sigPillClass(sig)}">${sig.replace('STRONG ','').replace('SELL','SELL')}</span>
    </div>`;
  }).join('');

  const others = Object.keys(STOCKS).filter(s => !WATCHLIST.includes(s));
  qp.innerHTML = others.slice(0,4).map(sym => {
    const s = STOCKS[sym];
    const prices = genPrices(s.ltp, 60);
    const sig = getSignal(s, prices);
    return `<div class="stock-item" onclick="loadStock('${sym}')">
      <span class="stock-sym">${sym}</span>
      <span class="stock-name-small">${s.name}</span>
      <span class="stock-sig ${sigPillClass(sig)}">${sig.split(' ').pop()}</span>
    </div>`;
  }).join('');
}

let currentTab = 'analysis';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = p.id === 'tab-'+tab ? '' : 'none');
}

async function loadStock(sym) {
  currentStock = sym;
  document.querySelectorAll('.stock-item').forEach(el => {
    el.classList.toggle('active', el.id === 'wi-'+sym || el.textContent.trim().startsWith(sym));
  });
  renderMain(sym);
}

function renderMain(sym) {
  const stock = STOCKS[sym];
  if (!stock) { renderNotFound(sym); return; }
  const prices60 = genPrices(stock.ltp, 60);
  const rsi = calcRSI(prices60);
  const sma20 = calcSMA(prices60, 20);
  const sma50 = calcSMA(prices60, 50);
  const macd = calcMACD(prices60);
  const boll = calcBollinger(prices60);
  const sig = getSignal(stock, prices60);
  const sc = signalClass(sig);
  const chg = stock.ltp - stock.prevClose;
  const chgPct = (chg/stock.prevClose*100).toFixed(2);
  const indicators = { rsi, sma20, sma50, macd, boll, signal: sig };
  const sigIcon = sig.includes('BUY') ? '↑' : sig.includes('SELL') ? '↓' : '→';

  document.getElementById('mainContent').innerHTML = `
    <div class="page-header">
      <div style="display:flex;align-items:center;gap:10px">
        <h1 style="font-family:var(--mono)">${sym}</h1>
        <span style="font-size:14px;color:var(--text2);margin-top:3px">${stock.name}</span>
        <span style="font-size:11px;background:var(--bg3);color:var(--text3);padding:2px 8px;border-radius:4px;border:1px solid var(--border);font-family:var(--mono)">${stock.sector}</span>
      </div>
      <div class="source-badges">
        <span class="src-badge">merolagani.com</span>
        <span class="src-badge">sharesansar.com</span>
        <span class="src-badge">NEPSE official</span>
      </div>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div class="mlabel">LTP</div>
        <div class="mval">Rs ${stock.ltp.toLocaleString()}</div>
        <div class="msub ${chg >= 0 ? 'up' : 'dn'}">${chg >= 0 ? '▲' : '▼'} ${Math.abs(chg).toFixed(1)} (${chg >= 0 ? '+' : ''}${chgPct}%)</div>
      </div>
      <div class="metric-card">
        <div class="mlabel">52w High</div>
        <div class="mval">Rs ${stock.high52.toLocaleString()}</div>
        <div class="msub neu">${((stock.high52-stock.ltp)/stock.ltp*100).toFixed(1)}% above</div>
      </div>
      <div class="metric-card">
        <div class="mlabel">52w Low</div>
        <div class="mval">Rs ${stock.low52.toLocaleString()}</div>
        <div class="msub neu">${((stock.ltp-stock.low52)/stock.low52*100).toFixed(1)}% above low</div>
      </div>
      <div class="metric-card">
        <div class="mlabel">Volume</div>
        <div class="mval">${(stock.volume/1000).toFixed(1)}K</div>
        <div class="msub neu">shares today</div>
      </div>
      <div class="metric-card">
        <div class="mlabel">P/E Ratio</div>
        <div class="mval">${stock.pe}x</div>
        <div class="msub neu">market cap ${stock.marketCap}</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="analysis" onclick="switchTab('analysis')">Analysis</button>
      <button class="tab-btn" data-tab="chart" onclick="switchTab('chart')">Chart</button>
      <button class="tab-btn" data-tab="portfolio" onclick="switchTab('portfolio')">Portfolio</button>
    </div>

    <!-- ANALYSIS TAB -->
    <div id="tab-analysis" class="tab-panel">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div class="signal-card">
          <div class="big-signal">
            <div class="signal-icon ${sc}"><span style="font-size:24px;color:${sigColor(sig)}">${sigIcon}</span></div>
            <div class="signal-text">
              <h2 style="color:${sigColor(sig)}">${sig}</h2>
              <p>Overall recommendation for ${sym}</p>
            </div>
          </div>
          <div class="score-row">
            <div class="score-chip">
              <div class="sc-label">RSI</div>
              <div class="sc-val ${rsi < 40 ? 'up' : rsi > 65 ? 'dn' : 'neu'}">${rsi}</div>
            </div>
            <div class="score-chip">
              <div class="sc-label">MACD</div>
              <div class="sc-val ${macd > 0 ? 'up' : 'dn'}">${macd > 0 ? '+' : ''}${macd}</div>
            </div>
            <div class="score-chip">
              <div class="sc-label">SMA 20</div>
              <div class="sc-val ${stock.ltp > sma20 ? 'up' : 'dn'}">Rs ${sma20}</div>
            </div>
          </div>
          <div class="zone-row">
            <div>
              <div class="zone-label">Bollinger Upper</div>
              <div class="zone-val neu">Rs ${boll.upper}</div>
            </div>
            <div style="text-align:center">
              <div class="zone-label">Mid band</div>
              <div class="zone-val neu">Rs ${boll.mid}</div>
            </div>
            <div style="text-align:right">
              <div class="zone-label">Lower band</div>
              <div class="zone-val neu">Rs ${boll.lower}</div>
            </div>
          </div>
        </div>

        <div class="ind-card">
          <div class="ind-title">Technical indicators</div>
          <div class="ind-row">
            <span class="ind-name">RSI (14)</span>
            <div class="ind-bar-wrap"><div class="ind-bar" style="width:${rsi}%;background:${rsi < 40 ? 'var(--green)' : rsi > 65 ? 'var(--red)' : 'var(--amber)'}"></div></div>
            <span class="ind-val ${rsi < 40 ? 'up' : rsi > 65 ? 'dn' : 'neu'}">${rsi} — ${rsi < 40 ? 'Oversold' : rsi > 65 ? 'Overbought' : 'Neutral'}</span>
          </div>
          <div class="ind-row">
            <span class="ind-name">MACD</span>
            <div class="ind-bar-wrap"><div class="ind-bar" style="width:${Math.min(Math.abs(macd)/10*100,100)}%;background:${macd>0?'var(--green)':'var(--red)'}"></div></div>
            <span class="ind-val ${macd > 0 ? 'up' : 'dn'}">${macd > 0 ? 'Bullish' : 'Bearish'} cross</span>
          </div>
          <div class="ind-row">
            <span class="ind-name">Price vs SMA 20</span>
            <div class="ind-bar-wrap"><div class="ind-bar" style="width:${Math.min(Math.abs((stock.ltp-sma20)/sma20*100*10),100)}%;background:${stock.ltp>sma20?'var(--green)':'var(--red)'}"></div></div>
            <span class="ind-val ${stock.ltp > sma20 ? 'up' : 'dn'}">${stock.ltp > sma20 ? 'Above' : 'Below'} SMA</span>
          </div>
          <div class="ind-row">
            <span class="ind-name">SMA 20 vs 50</span>
            <div class="ind-bar-wrap"><div class="ind-bar" style="width:${Math.min(Math.abs((sma20-sma50)/sma50*100*10),100)}%;background:${sma20>sma50?'var(--green)':'var(--red)'}"></div></div>
            <span class="ind-val ${sma20 > sma50 ? 'up' : 'dn'}">${sma20 > sma50 ? 'Golden cross' : 'Death cross'}</span>
          </div>
          <div class="ind-row">
            <span class="ind-name">Bollinger position</span>
            <div class="ind-bar-wrap">
              <div class="ind-bar" style="width:${Math.min(((stock.ltp-boll.lower)/(boll.upper-boll.lower)*100),100).toFixed(0)}%;background:var(--amber)"></div>
            </div>
            <span class="ind-val neu">${(((stock.ltp-boll.lower)/(boll.upper-boll.lower))*100).toFixed(0)}% in band</span>
          </div>
        </div>
      </div>

      <!-- AI card -->
      <div class="ai-card">
        <div class="ai-header">
          <div class="ai-badge">✦ Claude AI analysis</div>
          <span id="aiRisk" style="font-size:11px;color:var(--text3);font-family:var(--mono)"></span>
        </div>
        <div id="aiContent" class="ai-content"><div class="ai-loading"><div class="spinner"></div> Loading AI analysis...</div></div>
        <div id="aiZones" class="ai-zones"></div>
        <button class="ai-btn" id="aiRefreshBtn" onclick="refreshAI()">↻ Refresh AI analysis</button>
      </div>
    </div>

    <!-- CHART TAB -->
    <div id="tab-chart" class="tab-panel" style="display:none">
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-title">${sym} — Price history</span>
          <div class="period-btns">
            <button class="period-btn active" onclick="setPeriod(7, this)">1W</button>
            <button class="period-btn" onclick="setPeriod(30, this)">1M</button>
            <button class="period-btn" onclick="setPeriod(60, this)">3M</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="priceChartCanvas"></canvas></div>
      </div>
      <div class="two-col">
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">RSI (14-day)</span></div>
          <div style="height:140px;position:relative"><canvas id="rsiChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header"><span class="chart-title">Volume</span></div>
          <div style="height:140px;position:relative"><canvas id="volChart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- PORTFOLIO TAB -->
    <div id="tab-portfolio" class="tab-panel" style="display:none">
      <div class="ind-card">
        <div class="ind-title">My holdings</div>
        <table class="portfolio-table">
          <thead><tr><th>Symbol</th><th>Qty</th><th>Avg cost</th><th>LTP</th><th>P&L</th><th>Signal</th></tr></thead>
          <tbody>
            ${portfolioHoldings.map(h => {
              const s = STOCKS[h.sym];
              if (!s) return '';
              const pl = ((s.ltp - h.avgCost) * h.qty);
              const plPct = ((s.ltp - h.avgCost)/h.avgCost*100).toFixed(1);
              const ps = genPrices(s.ltp, 60);
              const psig = getSignal(s, ps);
              return `<tr>
                <td><span class="pf-sym">${h.sym}</span><br><span style="font-size:11px;color:var(--text3)">${s.name}</span></td>
                <td>${h.qty}</td>
                <td style="font-family:var(--mono)">Rs ${h.avgCost}</td>
                <td style="font-family:var(--mono)">Rs ${s.ltp}</td>
                <td class="${pl >= 0 ? 'up' : 'dn'}" style="font-family:var(--mono)">${pl >= 0 ? '+' : ''}Rs ${pl.toLocaleString()} (${pl >= 0 ? '+' : ''}${plPct}%)</td>
                <td><span class="stock-sig ${sigPillClass(psig)}">${psig}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--text3);font-family:var(--mono)">Total portfolio P&L</span>
          ${(() => {
            const total = portfolioHoldings.reduce((acc, h) => {
              const s = STOCKS[h.sym];
              return s ? acc + (s.ltp - h.avgCost) * h.qty : acc;
            }, 0);
            return `<span class="${total >= 0 ? 'up' : 'dn'}" style="font-size:18px;font-family:var(--mono);font-weight:600">${total >= 0 ? '+' : ''}Rs ${total.toLocaleString()}</span>`;
          })()}
        </div>
      </div>
    </div>
  `;

  // Render charts on chart tab activation
  document.querySelector('[data-tab="chart"]').addEventListener('click', () => {
    setTimeout(() => drawAllCharts(sym, prices60), 50);
  }, { once: true });

  // Auto-fetch AI
  getAIAnalysis(sym, stock, indicators);
  window._currentIndicators = indicators;
}

function refreshAI() {
  const s = STOCKS[currentStock];
  if (!s) return;
  const prices = genPrices(s.ltp, 60);
  const indicators = {
    rsi: calcRSI(prices), sma20: calcSMA(prices, 20), sma50: calcSMA(prices, 50),
    macd: calcMACD(prices), boll: calcBollinger(prices), signal: getSignal(s, prices)
  };
  getAIAnalysis(currentStock, s, indicators);
}

function drawAllCharts(sym, prices) {
  const stock = STOCKS[sym];
  if (!stock) return;
  const labels = prices.map((_, i) => i % 10 === 0 ? `-${prices.length-1-i}d` : '');

  // Price chart
  const pc = document.getElementById('priceChartCanvas');
  if (!pc) return;
  if (priceChart) { priceChart.destroy(); priceChart = null; }
  const up = prices[prices.length-1] >= prices[0];
  priceChart = new Chart(pc, {
    type: 'line',
    data: { labels, datasets: [{
      data: prices, borderColor: up ? '#4ac878' : '#e05252',
      backgroundColor: up ? 'rgba(74,200,120,0.06)' : 'rgba(224,82,82,0.06)',
      borderWidth: 1.5, pointRadius: 0, fill: true, tension: 0.3
    }, {
      data: prices.map((_, i) => calcSMA(prices.slice(0, i+1), Math.min(i+1,20))),
      borderColor: 'rgba(240,169,64,0.6)', borderWidth: 1, pointRadius: 0, fill: false, tension: 0.3
    }]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a6054', font: { size: 10 } } },
        y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a6054', font: { size: 10 }, callback: v => 'Rs '+v } } } }
  });

  // RSI chart
  const rc = document.getElementById('rsiChart');
  if (rc) {
    const rsiVals = prices.map((_, i) => i >= 14 ? calcRSI(prices.slice(0, i+1)) : null);
    new Chart(rc, {
      type: 'line',
      data: { labels, datasets: [{
        data: rsiVals, borderColor: '#f0a940', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3
      }, { data: prices.map(() => 70), borderColor: 'rgba(224,82,82,0.4)', borderWidth: 1, borderDash: [4,4], pointRadius: 0 },
        { data: prices.map(() => 30), borderColor: 'rgba(74,200,120,0.4)', borderWidth: 1, borderDash: [4,4], pointRadius: 0 }
      ]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a6054', font: { size: 10 } } },
          y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a6054', font: { size: 10 } } } } }
    });
  }

  // Volume chart
  const vc = document.getElementById('volChart');
  if (vc) {
    const vols = prices.map(() => Math.floor(stock.volume * (0.5 + Math.random())));
    new Chart(vc, {
      type: 'bar',
      data: { labels, datasets: [{ data: vols, backgroundColor: 'rgba(74,200,120,0.25)', borderColor: 'rgba(74,200,120,0.5)', borderWidth: 0 }]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: { color: '#4a6054', font: { size: 10 } } },
          y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#4a6054', font: { size: 10 }, callback: v => (v/1000).toFixed(0)+'K' } } } }
    });
  }
}

function setPeriod(days, el) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const stock = STOCKS[currentStock];
  if (!stock) return;
  const prices = genPrices(stock.ltp, days);
  if (priceChart) {
    priceChart.data.labels = prices.map((_, i) => i % Math.max(1, Math.floor(days/6)) === 0 ? `-${days-1-i}d` : '');
    priceChart.data.datasets[0].data = prices;
    priceChart.update('active');
  }
}

function searchStock() {
  const val = document.getElementById('searchInput').value.trim().toUpperCase();
  if (STOCKS[val]) { loadStock(val); document.getElementById('searchInput').value = ''; }
  else { alert(`Stock "${val}" not found. Try: ${Object.keys(STOCKS).join(', ')}`); }
}

function promptAddStock() {
  const sym = prompt('Enter stock symbol (e.g. NRIC, LICN, SCB):')?.trim().toUpperCase();
  if (sym && STOCKS[sym] && !WATCHLIST.includes(sym)) {
    WATCHLIST.push(sym);
    renderSidebar();
  } else if (sym) { alert(STOCKS[sym] ? 'Already in watchlist' : `${sym} not found`); }
}

function renderNotFound(sym) {
  document.getElementById('mainContent').innerHTML = `
    <div style="text-align:center;padding:60px 20px;color:var(--text3)">
      <div style="font-size:40px;margin-bottom:16px">⊘</div>
      <div style="font-family:var(--mono);font-size:16px;color:var(--text2)">${sym} not found</div>
      <div style="font-size:13px;margin-top:8px">Try: ${Object.keys(STOCKS).slice(0,6).join(', ')}</div>
    </div>`;
}

// Init
checkBackend().then(() => {
  renderSidebar();
  loadStock('NABIL');
});
</script>
